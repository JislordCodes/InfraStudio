version: 1.0
runtime: python311
build:
  commands:
    build:
      - python3 -m pip install --no-cache-dir --target /app/lib -e ./ifc-bonsai-mcp-main
      - python3 -m pip install --no-cache-dir --target /app/lib sentence-transformers chromadb fastapi uvicorn sse-starlette starlette mcp
run:
  command: python3 serve_mcp.py
  network:
    port: 8000
  env:
    - name: PORT
      value: "8000"

